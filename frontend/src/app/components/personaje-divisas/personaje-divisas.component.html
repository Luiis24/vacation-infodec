<div class="personaje-wrapper" [ngClass]="claseAnimacion">

  <!-- Monedas flotantes decorativas -->
  <div class="monedas-flotantes" *ngIf="estado === 'eufórico' || estado === 'feliz'">
    <span class="moneda m1">💰</span>
    <span class="moneda m2">💵</span>
    <span class="moneda m3">🪙</span>
  </div>

  <!-- Lluvia de billetes rotos si está devastado -->
  <div class="billetes-rotos" *ngIf="estado === 'devastado'">
    <span class="billete b1">💸</span>
    <span class="billete b2">📉</span>
    <span class="billete b3">💸</span>
  </div>

  <!-- Personaje SVG -->
  <svg
    class="personaje-svg"
    viewBox="0 0 200 220"
    xmlns="http://www.w3.org/2000/svg"
  >
    <!-- Sombra -->
    <ellipse cx="100" cy="210" rx="45" ry="6" fill="rgba(0,0,0,0.15)"/>

    <!-- Cuerpo -->
    <rect x="70" y="130" width="60" height="70" rx="18"
          fill="url(#gradCuerpo)"/>

    <!-- Cabeza -->
    <circle cx="100" cy="90" r="48" fill="url(#gradCara)"/>

    <!-- Cabello -->
    <path d="M55,75 Q100,25 145,75 Q145,55 100,42 Q55,55 55,75 Z"
          fill="#2b2b3a"/>

    <!-- Cejas (varían según estado) -->
    <g class="cejas">
      <path *ngIf="estado === 'eufórico'"
            d="M72,72 Q82,66 92,72" stroke="#2b2b3a" stroke-width="3"
            fill="none" stroke-linecap="round"/>
      <path *ngIf="estado === 'eufórico'"
            d="M108,72 Q118,66 128,72" stroke="#2b2b3a" stroke-width="3"
            fill="none" stroke-linecap="round"/>

      <path *ngIf="estado === 'feliz'"
            d="M72,74 Q82,70 92,74" stroke="#2b2b3a" stroke-width="3"
            fill="none" stroke-linecap="round"/>
      <path *ngIf="estado === 'feliz'"
            d="M108,74 Q118,70 128,74" stroke="#2b2b3a" stroke-width="3"
            fill="none" stroke-linecap="round"/>

      <path *ngIf="estado === 'neutral'"
            d="M72,74 L92,74" stroke="#2b2b3a" stroke-width="3"
            stroke-linecap="round"/>
      <path *ngIf="estado === 'neutral'"
            d="M108,74 L128,74" stroke="#2b2b3a" stroke-width="3"
            stroke-linecap="round"/>

      <path *ngIf="estado === 'preocupado'"
            d="M72,68 Q82,74 92,78" stroke="#2b2b3a" stroke-width="3"
            fill="none" stroke-linecap="round"/>
      <path *ngIf="estado === 'preocupado'"
            d="M108,78 Q118,74 128,68" stroke="#2b2b3a" stroke-width="3"
            fill="none" stroke-linecap="round"/>

      <path *ngIf="estado === 'devastado'"
            d="M72,66 Q82,74 92,80" stroke="#2b2b3a" stroke-width="3"
            fill="none" stroke-linecap="round"/>
      <path *ngIf="estado === 'devastado'"
            d="M108,80 Q118,74 128,66" stroke="#2b2b3a" stroke-width="3"
            fill="none" stroke-linecap="round"/>
    </g>

    <!-- Ojos -->
    <g class="ojos">
      <!-- Eufórico: ojos estrella -->
      <g *ngIf="estado === 'eufórico'">
        <path d="M78,88 L82,96 L90,96 L84,101 L86,109 L78,104 L70,109
                 L72,101 L66,96 L74,96 Z" fill="#ffcc00"/>
        <path d="M122,88 L126,96 L134,96 L128,101 L130,109 L122,104 L114,109
                 L116,101 L110,96 L118,96 Z" fill="#ffcc00"/>
      </g>

      <!-- Feliz / Neutral / Preocupado: ojos redondos -->
      <g *ngIf="estado === 'feliz' || estado === 'neutral' || estado === 'preocupado'">
        <ellipse cx="82" cy="92" rx="7" ry="8" fill="#ffffff"/>
        <ellipse cx="118" cy="92" rx="7" ry="8" fill="#ffffff"/>
        <circle cx="83" cy="93" r="4" fill="#2b2b3a"/>
        <circle cx="119" cy="93" r="4" fill="#2b2b3a"/>
        <circle cx="84.5" cy="91.5" r="1.3" fill="#ffffff"/>
        <circle cx="120.5" cy="91.5" r="1.3" fill="#ffffff"/>
      </g>

      <!-- Devastado: ojos X_X -->
      <g *ngIf="estado === 'devastado'">
        <path d="M75,86 L89,100 M89,86 L75,100"
              stroke="#2b2b3a" stroke-width="3" stroke-linecap="round"/>
        <path d="M111,86 L125,100 M125,86 L111,100"
              stroke="#2b2b3a" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Mejillas -->
    <circle *ngIf="estado === 'eufórico' || estado === 'feliz'"
            cx="65" cy="105" r="7" fill="#ff9aa2" opacity="0.7"/>
    <circle *ngIf="estado === 'eufórico' || estado === 'feliz'"
            cx="135" cy="105" r="7" fill="#ff9aa2" opacity="0.7"/>

    <!-- Lágrimas si devastado -->
    <g *ngIf="estado === 'devastado'">
      <ellipse cx="78" cy="105" rx="2.5" ry="4" fill="#4dabf7"/>
      <ellipse cx="122" cy="105" rx="2.5" ry="4" fill="#4dabf7"/>
    </g>

    <!-- Boca -->
    <g class="boca">
      <!-- Eufórico: boca abierta sonriendo -->
      <path *ngIf="estado === 'eufórico'"
            d="M78,112 Q100,132 122,112 Q100,120 78,112 Z"
            fill="#8b1e1e"/>

      <!-- Feliz: sonrisa -->
      <path *ngIf="estado === 'feliz'"
            d="M80,114 Q100,128 120,114"
            stroke="#8b1e1e" stroke-width="3" fill="none"
            stroke-linecap="round"/>

      <!-- Neutral: línea recta -->
      <path *ngIf="estado === 'neutral'"
            d="M82,118 L118,118"
            stroke="#8b1e1e" stroke-width="3"
            stroke-linecap="round"/>

      <!-- Preocupado: curva invertida -->
      <path *ngIf="estado === 'preocupado'"
            d="M82,122 Q100,112 118,122"
            stroke="#8b1e1e" stroke-width="3" fill="none"
            stroke-linecap="round"/>

      <!-- Devastado: boca abierta triste -->
      <path *ngIf="estado === 'devastado'"
            d="M82,120 Q100,108 118,120 Q100,128 82,120 Z"
            fill="#8b1e1e"/>
    </g>

    <!-- Símbolo de dinero/efecto adicional -->
    <g class="simbolo-extra" *ngIf="estado === 'preocupado' || estado === 'devastado'">
      <text x="150" y="65" font-size="22" text-anchor="middle">💧</text>
    </g>

    <defs>
      <linearGradient id="gradCara" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffe0bd"/>
        <stop offset="100%" stop-color="#f5c896"/>
      </linearGradient>
      <linearGradient id="gradCuerpo" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#5b8cff"/>
        <stop offset="100%" stop-color="#3a5fbf"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Texto del estado -->
  <p class="texto-estado" *ngIf="textoEs || textoDe">
    {{ textoEs || textoDe }}
  </p>

</div>
